<!doctype html>
<!-- Instagram post for the HYROX Youngstars interest list, 1080x1350 (4:5):
     assets/social/hyrox-instagram.png. Rendered with: node scripts/instagram-hyrox.mjs (needs playwright-core). -->
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #000; font-family: "Helvetica Neue", Arial, sans-serif; color: #f6f8ee; }
  .post { position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background: radial-gradient(ellipse 70% 40% at 85% 6%, rgba(227,255,46,.24), transparent 70%),
      repeating-linear-gradient(115deg, transparent 0 60px, rgba(227,255,46,.05) 60px 120px), linear-gradient(170deg, #171a0e 0%, #0a0b08 60%); }
  .post::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 22px;
    background: repeating-linear-gradient(-45deg, #e3ff2e 0 30px, #0a0b08 30px 60px); }
  .tag { position: absolute; left: 70px; top: 64px; display: flex; align-items: center; gap: 16px; color: #e3ff2e; font-size: 30px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
  .tag svg { width: 40px; height: 40px; }
  .photo { position: absolute; left: 70px; top: 130px; width: 940px; height: 560px; border: 7px solid #e3ff2e; border-radius: 30px; overflow: hidden; transform: rotate(-1.2deg);
    box-shadow: 0 0 90px rgba(227,255,46,.28); background: url("../assets/kids-nogi.jpg") 50% 38%/cover; }
  h1 { position: absolute; left: 70px; top: 735px; font-size: 134px; line-height: .88; font-weight: 900; font-style: italic; letter-spacing: -.025em; text-transform: uppercase; }
  h1 span { display: block; color: #e3ff2e; }
  .when { position: absolute; left: 70px; top: 992px; font-size: 56px; line-height: 1.1; font-weight: 900; letter-spacing: .03em; text-transform: uppercase; }
  .chips { position: absolute; left: 70px; top: 1082px; display: flex; gap: 16px; }
  .chips span { padding: 14px 26px; border: 3px solid rgba(227,255,46,.6); border-radius: 999px; background: rgba(227,255,46,.1); font-size: 30px; font-weight: 800; color: #eef5c8; }
  .cta { position: absolute; left: 70px; right: 70px; bottom: 66px; display: flex; justify-content: space-between; align-items: center; padding: 0 0 0 0; }
  .cta b { padding: 20px 40px; background: #e3ff2e; color: #0a0b08; font-size: 34px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%); }
  .cta span { font-size: 28px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
  .cta span i { font-style: normal; color: #e3ff2e; }
</style></head><body>
<div class="post">
  <div class="tag"><svg viewBox="0 0 24 24" fill="#e3ff2e"><path d="M13.2 2 4.5 13.4h6L9.3 22l9.2-12.2h-6.1z"/></svg>Kids fitness race</div>
  <div class="photo"></div>
  <h1>HYROX<span>YOUNGSTARS</span></h1>
  <div class="when">Houston &middot; April 3&ndash;4, 2027</div>
  <div class="chips"><span>Ages 8&ndash;15</span><span>Train with Labyrinth</span><span>Free to join the list</span></div>
  <div class="cta"><b>Join the interest list</b><span><i>Labyrinth</i> BJJ</span></div>
</div>
</body></html>
