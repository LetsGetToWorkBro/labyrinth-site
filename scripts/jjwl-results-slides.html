<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>JJWL Houston results: the three slides as one 3240x1350 picture</title>
<!-- scripts/instagram-jjwl-results.mjs serves this page, with the graded photographs and the brand masks under /work/, and cuts it into three 1080x1350 slides. -->
<style>
@font-face{font-family:"Corm";src:url(/scripts/fonts/cormorant-garamond-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:"Jost";src:url(/scripts/fonts/jost-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Jost";src:url(/scripts/fonts/jost-latin-500-normal.woff2) format("woff2");font-weight:500}
/* the motto 迷宮を征服せよ: one slice of Noto Sans JP for each glyph it needs (a slice carries thousands; the range says which ones to use) */
@font-face{font-family:"Noto Sans JP";src:url(/scripts/fonts/noto-sans-jp-99-500-normal.woff2) format("woff2");font-weight:500;unicode-range:U+8FF7}
@font-face{font-family:"Noto Sans JP";src:url(/scripts/fonts/noto-sans-jp-109-500-normal.woff2) format("woff2");font-weight:500;unicode-range:U+5BAE}
@font-face{font-family:"Noto Sans JP";src:url(/scripts/fonts/noto-sans-jp-119-500-normal.woff2) format("woff2");font-weight:500;unicode-range:U+3092,U+305B,U+3088}
@font-face{font-family:"Noto Sans JP";src:url(/scripts/fonts/noto-sans-jp-80-500-normal.woff2) format("woff2");font-weight:500;unicode-range:U+5F81}
@font-face{font-family:"Noto Sans JP";src:url(/scripts/fonts/noto-sans-jp-107-500-normal.woff2) format("woff2");font-weight:500;unicode-range:U+670D}
:root{--bone:#ece4d2;--ink:#060504;--gold:rgba(214,176,98,.92);--base:417px}
*{box-sizing:border-box}
html,body{margin:0;background:#000}
#pano{position:relative;width:3240px;height:1350px;overflow:hidden;background:var(--ink)}
.layer{position:absolute;inset:0}
.at{position:absolute;top:0;width:1080px;height:1350px;overflow:hidden}
.at:nth-child(1){left:0}.at:nth-child(2){left:1080px}.at:nth-child(3){left:2160px}
.abs{position:absolute}

/* the ground: warm black with the faintest stone grain */
.ground{background:var(--ink) url(/scripts/jjwl-results-plates/ground.jpg) center/3240px 1350px no-repeat}
.ground::after{content:"";position:absolute;inset:0;background:rgba(6,5,4,.78)}

/* the maze mark without its lettering, ghosted into the black round each masthead */
.maze{position:absolute;width:var(--d,900px);height:var(--d,900px);left:var(--x,0);top:var(--y,0);background:rgba(236,224,196,var(--o,.09));-webkit-mask:url(/work/brand/seal-maze-ring.png) center/100% 100% no-repeat;mask:url(/work/brand/seal-maze-ring.png) center/100% 100% no-repeat;mix-blend-mode:screen}

/* the thread: Higgsfield's smoke ribbon, one piece across the whole swipe, behind the plates. The blend is on the layer, not on the image: a mask on the layer
   would otherwise cut the image off from what is under it, and its black would cover the ground. */
.ribbon{position:absolute;left:0;top:0;transform-origin:0 0}
.thread{mix-blend-mode:screen;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 150px,#000 2290px,transparent 2480px);mask-image:linear-gradient(90deg,transparent 0,#000 150px,#000 2290px,transparent 2480px)}

/* the plate: the photograph, a little smaller than the slide, melting into the black on three sides */
.plate{position:absolute;left:108px;top:270px;width:864px;height:1080px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 110px,#000 calc(100% - 110px),transparent 100%),linear-gradient(180deg,transparent 0,#000 150px);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0,#000 110px,#000 calc(100% - 110px),transparent 100%),linear-gradient(180deg,transparent 0,#000 150px);mask-composite:intersect}
.plate img{display:block;width:100%;height:100%}
/* whoever stands at the edges of a picture fades into the dark first */
.plate::after{content:"";position:absolute;inset:0;background:var(--extra,linear-gradient(transparent,transparent)),linear-gradient(90deg,rgba(6,5,4,var(--sl,.4)) 0,rgba(6,5,4,0) var(--slw,30%),rgba(6,5,4,0) calc(100% - var(--srw,30%)),rgba(6,5,4,var(--sr,.5)) 100%)}

/* gold foil, cut to a shape */
.foil{background:url(/scripts/jjwl-results-plates/foil-gold.jpg) var(--fx,0) var(--fy,0)/1200px auto;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.lit{filter:drop-shadow(0 1px 0 rgba(0,0,0,.6)) drop-shadow(0 12px 20px rgba(0,0,0,.5)) drop-shadow(0 0 34px rgba(222,182,96,.16))}
.num{font-family:"Corm",serif;font-weight:600;font-size:380px;line-height:.66;letter-spacing:0;white-space:nowrap}
.plaque{width:150px;height:250px;background:url(/scripts/jjwl-results-plates/foil-gold.jpg) -260px -420px/1000px auto;-webkit-mask:url(/work/brand/seal-kanji.png) center/100% 100% no-repeat;mask:url(/work/brand/seal-kanji.png) center/100% 100% no-repeat}

/* The masthead stands on one line, y = var(--base): the numeral or the nameplate at the left, the words flush right with their last line on that same baseline.
   The numerals' ink is 236px tall and starts 16px in from the box, so they sit at left 119px to put it on the margin, x = 135, and at top 177px / 176px
   to stand on the ledge; the nameplate is 250px tall, top 166px. */
.ledge{position:absolute;left:135px;top:var(--base);width:405px;height:2px;background:linear-gradient(90deg,var(--gold),rgba(214,176,98,.6) 72%,transparent)}
.tb{position:absolute;right:135px;bottom:calc(1350px - var(--base) - 8px);text-align:right;color:var(--bone);font-family:"Jost",sans-serif;text-transform:uppercase;text-shadow:0 0 16px rgba(6,5,4,.95),0 0 5px rgba(6,5,4,.85)}
.tb .a{font-weight:500;font-size:36px;line-height:1.28;letter-spacing:.3em;margin-right:-.3em}
.tb .s{display:block;width:64px;height:2px;margin:20px 0 18px auto;background:var(--gold)}
.tb .b{font-weight:400;font-size:27px;line-height:1.45;letter-spacing:.3em;margin-right:-.3em;opacity:.76}
.tb .j{font-family:"Noto Sans JP","Jost",sans-serif;font-weight:500;letter-spacing:.18em;margin-right:-.18em;opacity:.84}
</style></head>
<body>
<div id="pano">
  <div class="layer ground"></div>

  <div class="layer" style="pointer-events:none">
    <i class="maze" style="--x:-252px;--y:-153px"></i>
    <i class="maze" style="--x:840px;--y:-159px"></i>
    <i class="maze" style="--x:2030px;--y:-153px"></i>
  </div>

  <div class="layer thread" style="pointer-events:none">
    <img class="ribbon" src="/scripts/jjwl-results-plates/ribbon.jpg" width="2688" height="1520" alt="" style="opacity:.9;transform:translate(-560px,720px) rotate(-38deg) scale(1.3)">
  </div>

  <div class="layer">
    <div class="at"><div class="plate" style="top:312px;--sl:.3;--sr:.5"><img src="/work/cover.png" alt=""></div></div>
    <div class="at"><div class="plate" style="--sl:.78;--slw:34%;--sr:.78;--srw:34%"><img src="/work/team.png" alt=""></div></div>
    <div class="at"><div class="plate" style="--sl:.94;--slw:52%;--sr:.9;--srw:44%;--extra:radial-gradient(ellipse 190px 150px at 235px 105px,rgba(6,5,4,.95),rgba(6,5,4,.8) 55%,rgba(6,5,4,0) 100%),radial-gradient(ellipse 120px 110px at 700px 270px,rgba(6,5,4,.8),rgba(6,5,4,0) 100%)"><img src="/work/trophy.png" alt=""></div></div>
  </div>

  <div class="layer">
    <div class="at">
      <div class="abs lit" style="left:119px;top:177px"><div class="num foil" style="--fx:-120px;--fy:-80px">I</div></div>
      <div class="ledge"></div>
      <div class="tb"><div class="a">No-Gi<br>First overall</div><i class="s"></i><div class="b">JJWL Houston<br>October 17</div></div>
    </div>
    <div class="at">
      <div class="abs lit" style="left:135px;top:166px"><div class="plaque"></div></div>
      <div class="ledge"></div>
      <div class="tb"><div class="a">Team<br>Labyrinth</div><i class="s"></i><div class="b">JJWL Houston<br>October 17</div></div>
    </div>
    <div class="at">
      <div class="abs lit" style="left:119px;top:176px"><div class="num foil" style="--fx:-600px;--fy:-300px">III</div></div>
      <div class="ledge"></div>
      <div class="tb"><div class="a">Gi<br>Third place</div><i class="s"></i><div class="b j">迷宮を征服せよ</div></div>
    </div>
  </div>
</div>
</body></html>
