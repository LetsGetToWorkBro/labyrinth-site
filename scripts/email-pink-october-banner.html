<!doctype html>
<!-- Banner for the Pink October member email (assets/social/pink-october-email-banner.jpg), 1200x630.
     Rendered with: node scripts/email-pink-october-banner.mjs  (needs playwright-core). -->
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; font-family: "Helvetica Neue", Arial, sans-serif; background: #270e1a; }
  .photo { position: absolute; inset: 0; background: url("../assets/strength-conditioning.jpg") 50% 14%/cover; }
  .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(229,143,181,.28) 0%, rgba(229,143,181,.12) 45%, rgba(39,14,26,.55) 72%, #270e1a 100%); mix-blend-mode: multiply; }
  .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 320px; background: linear-gradient(180deg, transparent, rgba(39,14,26,.92)); }
  .copy { position: absolute; left: 56px; bottom: 40px; right: 56px; color: #fff; }
  .tag { color: #E58FB5; font-size: 24px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
  h1 { margin-top: 8px; font-size: 128px; line-height: .95; font-weight: 900; letter-spacing: -.02em; text-transform: uppercase; }
  h1 span { color: #E58FB5; }
</style></head><body>
  <div class="photo"></div><div class="shade"></div>
  <div class="copy"><div class="tag">Breast Cancer Awareness Month</div><h1>Pink <span>October</span></h1></div>
</body></html>
