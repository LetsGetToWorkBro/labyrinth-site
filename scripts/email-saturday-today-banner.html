<!doctype html>
<!-- Banner for the "Today" reminder email on a day that runs differently (assets/social/saturday-today-email-banner.jpg), 1200x630.
     Rendered with: node scripts/email-saturday-today-banner.mjs  (needs playwright-core). Plum and pink, like the seminar's own banner, with
     the day in three tiles so it can be read at the size of an inbox thumbnail. The times are the entry in scripts/schedule_data.py: SPECIAL_DAYS. -->
<html><head><meta charset="utf-8"><style>
  @font-face { font-family: "Anton"; src: url("fonts/anton-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Oswald"; font-weight: 700; src: url("fonts/oswald-latin-700-normal.woff2") format("woff2"); }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; font-family: "Oswald", "Helvetica Neue", Arial, sans-serif; color: #fff;
         background: radial-gradient(ellipse at 82% 12%, #5a1b3a 0%, #2f0f20 46%, #1a0b12 100%); }
  .ribbon { position: absolute; right: -70px; top: -60px; width: 560px; height: 560px; color: #E58FB5; opacity: .16; transform: rotate(14deg); }
  .rule { position: absolute; left: 56px; right: 56px; top: 300px; height: 3px; background: linear-gradient(90deg, #E58FB5, rgba(229,143,181,.15)); }
  .top { position: absolute; left: 56px; top: 52px; right: 56px; }
  .today { font-family: "Anton", "Oswald", Impact, sans-serif; font-size: 214px; line-height: 1; letter-spacing: .02em; text-transform: uppercase; color: #fff; }
  .date { position: absolute; left: 660px; top: 128px; font-size: 50px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #fbd3e3; line-height: 1.18; }
  .date b { display: block; color: #E58FB5; font-weight: 700; }
  .tiles { position: absolute; left: 56px; right: 56px; top: 334px; bottom: 44px; display: grid; grid-template-columns: 1fr 1fr 1.28fr; gap: 20px; }
  .tile { border-radius: 18px; padding: 26px 28px; background: rgba(251,211,227,.10); border: 2px solid rgba(229,143,181,.36); display: flex; flex-direction: column; justify-content: space-between; }
  .tile.hot { background: #E58FB5; border-color: #E58FB5; color: #1a0b12; }
  .time { font-family: "Anton", "Oswald", Impact, sans-serif; font-size: 92px; line-height: 1; letter-spacing: .01em; }
  .time small { font-family: "Oswald", sans-serif; font-size: 36px; font-weight: 700; letter-spacing: .06em; margin-left: 8px; }
  .what { font-size: 40px; line-height: 1.08; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
  .tile:not(.hot) .time { color: #fff; } .tile:not(.hot) .what { color: #E58FB5; }
</style></head><body>
  <svg class="ribbon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c-2.6 0-4.4 1.8-4.4 4.3 0 2.2 1.2 3.9 2.7 5.6L7.2 21.2l2 .9 2.8-6.6 2.8 6.6 2-.9-3.1-9.3c1.5-1.7 2.7-3.4 2.7-5.6C16.4 3.8 14.6 2 12 2zm0 2c1.4 0 2.4.9 2.4 2.3 0 1.3-.8 2.5-2.4 4.2-1.6-1.7-2.4-2.9-2.4-4.2C9.6 4.9 10.6 4 12 4z"/></svg>
  <div class="top"><div class="today">Today</div></div>
  <div class="rule"></div>
  <div class="date"><b>Saturday</b>October 24</div>
  <div class="tiles">
    <div class="tile"><div class="time">9:00<small>AM</small></div><div class="what">Workout</div></div>
    <div class="tile"><div class="time">10:00<small>AM</small></div><div class="what">Open mat</div></div>
    <div class="tile hot"><div class="time">11:00<small>AM</small></div><div class="what">Rolling for Ribbons</div></div>
  </div>
</body></html>
