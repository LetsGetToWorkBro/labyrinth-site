<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<style>
  /* Email banner for the Saturday MMA Conditioning class, 1200x630: assets/social/mma-email-banner.jpg.
     Rendered by mma-art.mjs. Black and fight-night red with Coach Scott's portrait. */
  html,body{margin:0;padding:0;background:#0b0909}
  .art{position:relative;width:1200px;height:630px;overflow:hidden;font-family:Arial Black,Arial,Helvetica,sans-serif;color:#f6f1ee;
    background:radial-gradient(ellipse 55% 90% at 80% 40%,rgba(230,57,70,.34),transparent 70%),
      repeating-linear-gradient(125deg,transparent 0 44px,rgba(255,255,255,.025) 44px 88px),linear-gradient(160deg,#1c0e0e 0%,#0b0909 65%)}
  .art::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:linear-gradient(90deg,#e63946 0 62%,#c9a96a 62% 100%)}
  .photo{position:absolute;right:0;top:0;width:430px;height:630px;background:url("../assets/coach-scott.jpg") 50% 22%/cover;filter:grayscale(1) contrast(1.08)}
  .photo::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0b0909 0%,rgba(11,9,9,.2) 40%,transparent 100%)}
  .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(11,9,9,.7));mix-blend-mode:multiply}
  .copy{position:absolute;left:64px;top:70px;width:700px}
  .tag{font:800 24px/1 Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#e63946}
  h1{margin:20px 0 0;font-size:92px;line-height:.9;font-weight:900;font-style:italic;letter-spacing:-.02em;text-transform:uppercase}
  h1 span{display:block;color:#e63946}
  .when{margin-top:30px;font:900 44px/1.1 Arial,sans-serif;letter-spacing:.03em;text-transform:uppercase}
  .sub{margin-top:14px;font:700 26px/1.3 Arial,sans-serif;color:#bdb2ad}
  .chips{margin-top:28px;display:flex;gap:14px}
  .chips span{padding:12px 22px;border:2px solid rgba(230,57,70,.7);border-radius:999px;background:rgba(230,57,70,.12);font:800 22px/1 Arial,sans-serif;color:#ffd9dc}
  .brand{position:absolute;right:50px;bottom:40px;font:800 20px/1.4 Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;text-align:right}
  .brand b{color:#c9a96a}
</style></head><body>
<div class="art">
  <div class="photo"></div>
  <div class="copy">
    <div class="tag">Tomorrow &middot; Saturday</div>
    <h1>MMA<span>Conditioning</span></h1>
    <div class="when">9:00 AM &middot; All ages</div>
    <div class="sub">With Coach Scott Jones, 7th dan Taekwondo black belt</div>
    <div class="chips"><span>Beginners welcome</span><span>First class free</span></div>
  </div>
  <div class="brand"><b>Labyrinth</b> BJJ<br>Fulshear, TX</div>
</div>
</body></html>
