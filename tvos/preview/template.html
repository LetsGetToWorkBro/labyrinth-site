<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labyrinth Round Timer — Apple TV</title>
<style>
  /* A 1:1 mirror of the tvOS screen, laid out on the same 1920x1080 point
     canvas the app draws on and scaled to fit whatever is looking at it.
     Same palette, same type stack (SF Pro Rounded on Apple hardware), same
     focus model — so what you see here is what shows up on the TV. */
  :root {
    --ink: #0A0A0A;
    --surface: #141414;
    --surface-lift: #1A1A1A;
    --bone: #F0F0F0;
    --muted: #8A8A8A;
    --faint: #555555;
    --gold: #C8A24C;
    --gold-light: #E8C96B;
    --red: #E74C3C;
    --green: #27AE60;
    --yellow: #E2B93B;
    --accent: var(--gold);
    --face: var(--gold);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont,
                 "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #viewport { position: fixed; inset: 0; overflow: hidden; }

  /* Pinned to the middle by hand rather than by grid centring: an item larger
     than its container centres inconsistently, and the whole point is that the
     1920x1080 canvas lands dead centre at any window size. */
  #stage {
    position: absolute;
    top: 50%;
    left: 50%;
    margin: -540px 0 0 -960px;
    width: 1920px;
    height: 1080px;
    background: var(--ink);
    overflow: hidden;
    transform-origin: center center;
    color: var(--bone);
    transition: background 600ms ease;
  }

  /* ---------- backdrop ---------- */
  .bloom {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 50%,
      color-mix(in srgb, var(--accent) 16%, transparent) 0px,
      color-mix(in srgb, var(--accent) 4%, transparent) 520px,
      transparent 1100px);
    mix-blend-mode: screen;
    opacity: var(--bloom, 0.55);
    transition: opacity 600ms ease, background 600ms ease;
  }

  .rings {
    position: absolute;
    top: 50%; left: 50%;
    width: 1500px; height: 1500px;
    margin: -750px 0 0 -750px;
    opacity: 0.06;
    background: var(--accent);
    -webkit-mask: url(__RINGS__) center / contain no-repeat;
    mask: url(__RINGS__) center / contain no-repeat;
    animation: spin 420s linear infinite;
    transition: background 600ms ease;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hairline {
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(200,162,76,0.55), transparent);
  }

  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 50%, transparent 500px, rgba(0,0,0,0.75) 1500px);
    pointer-events: none;
  }

  /* ---------- layout ---------- */
  .frame {
    position: absolute;
    inset: 60px;                 /* the tvOS safe area */
    padding: 10px 48px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;   /* header pinned top, strip pinned bottom */
  }

  /* The clock is centred on the stage itself, not laid out between the header
     and the strip, so it sits in the middle of the TV. */
  .centre {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
  }

  header { display: flex; align-items: flex-start; justify-content: space-between; }

  .lockup { display: flex; align-items: center; gap: 28px; }
  .lockup .kanji { height: 130px; }
  .lockup .word  { height: 84px; }
  .mark { display: block; }

  .wallclock { text-align: right; }
  .wallclock .time {
    font-size: 86px; font-weight: 700; font-variant-numeric: tabular-nums;
    letter-spacing: -0.015em; line-height: 1.05;
  }
  .wallclock .date { margin-top: 4px; font-size: 28px; letter-spacing: 4px; font-weight: 700; }

  .label {
    text-transform: uppercase; color: var(--muted); font-weight: 600;
  }

  /* ---------- clock face ---------- */
  .facecol {
    width: 1180px;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }

  /* Just the round number. What the timer is doing is the bar's job, and
     saying it twice on a wall screen is noise. */
  .badge {
    display: flex; align-items: center; gap: 22px;
    padding: 16px 34px;
    border-radius: 10px;
    background: color-mix(in srgb, var(--surface) 85%, transparent);
    border: 1.5px solid color-mix(in srgb, var(--accent) 45%, transparent);
    transition: border-color 600ms ease;
  }
  .badge .k { font-size: 24px; letter-spacing: 6px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
  .badge .n { font-size: 46px; font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; transition: color 600ms ease; }

  .face {
    font-size: 320px;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    color: var(--face);
    text-shadow: 0 0 46px color-mix(in srgb, var(--face) 20%, transparent);
    transition: color 400ms ease, transform 260ms cubic-bezier(.2,.9,.3,1.2);
  }
  .face.pulse { transform: scale(1.022); }

  /* The bar under the clock is the only thing on screen that says what the
     timer is doing, so it says it four ways: colour follows the phase, a bright
     edge rides the end of the fill while it runs, a notch marks where the
     warning will fire, and a paused bar dims and breathes so a stopped clock
     never looks like a dead screen. */
  .track {
    position: relative;
    width: 100%;
    height: 18px;
    border-radius: 999px;
    background: rgba(255,255,255,0.07);
    transition: opacity 400ms ease;
  }
  .track > i {
    position: absolute; inset: 0 auto 0 0;
    border-radius: 999px;
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--accent) 65%, transparent), var(--accent));
    box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 55%, transparent);
    transition: background 600ms ease, box-shadow 400ms ease;
  }
  /* the live edge */
  .track > i::after {
    content: ""; position: absolute; top: 0; right: 0; bottom: 0;
    width: 6px; border-radius: 999px;
    background: rgba(255,255,255,0.9);
    box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 95%, transparent);
    transition: width 300ms ease, background 300ms ease, box-shadow 300ms ease;
  }
  .track > u {
    position: absolute; top: -6px; width: 3px; height: 30px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--bone) 50%, transparent);
  }
  .track > u[hidden] { display: none; }

  .stage-warning .track > i::after { width: 10px; box-shadow: 0 0 22px var(--accent); }

  .stage-paused .track { animation: breathe 3.4s ease-in-out infinite; }
  .stage-paused .track > i { box-shadow: none; }
  .stage-paused .track > i::after { background: rgba(255,255,255,0.25); box-shadow: none; }
  @keyframes breathe { 0%, 100% { opacity: 0.85; } 50% { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) {
    .stage-paused .track { animation: none; opacity: 0.6; }
  }

  /* ---------- the settings strip ---------- */
  /* No labels — the colour is the label. Green is the round, yellow the
     warning, red the rest, gold the round count, which is what a coach glances
     at from the middle of the mat. That leaves the whole container to the
     number. Left/right walks the strip, up/down changes the focused value. */
  .cards { flex: 1; display: flex; gap: 20px; }

  .card {
    flex: 1; min-width: 0; height: 224px;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 12px 20px;
    border-radius: 24px;
    background: color-mix(in srgb, var(--tint) 12%, transparent);
    border: 1.5px solid color-mix(in srgb, var(--tint) 42%, transparent);
    transition: transform 320ms cubic-bezier(.2,.9,.3,1.2), border-color 200ms, background 200ms, box-shadow 200ms;
  }
  .card.on {
    background: color-mix(in srgb, var(--tint) 26%, transparent);
    border: 3.5px solid var(--tint);
    transform: scale(1.04);
    box-shadow: 0 12px 28px color-mix(in srgb, var(--tint) 40%, transparent);
  }
  .card .v {
    font-size: 104px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums;
    color: var(--bone); white-space: nowrap;
    max-width: 100%;
  }
  /* The chevrons always hold their space so the number never jumps on focus. */
  .card .step {
    height: 32px; font-size: 28px; line-height: 32px; color: var(--tint);
    opacity: 0; user-select: none;
  }
  .card.on .step { opacity: 1; }
  .card.on .step.off { opacity: 0.18; }

  /* ---------- transport ---------- */
  footer { display: flex; align-items: center; gap: 56px; }
  .transport { display: flex; gap: 44px; align-items: flex-start; }

  .tbtn { display: flex; flex-direction: column; align-items: center; gap: 14px;
          transition: transform 320ms cubic-bezier(.2,.9,.3,1.2); cursor: pointer; }
  .tbtn.on { transform: scale(1.09); }
  .tbtn .disc {
    width: 196px; height: 196px; border-radius: 50%;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--surface) 85%, transparent);
    border: 2.5px solid color-mix(in srgb, var(--gold) 30%, transparent);
    transition: background 200ms, border-color 200ms, box-shadow 200ms;
  }
  .tbtn.big .disc {
    background: color-mix(in srgb, var(--accent) 18%, transparent);
    border-color: color-mix(in srgb, var(--accent) 75%, transparent);
  }
  .tbtn.on .disc { background: var(--gold); border-color: transparent; box-shadow: 0 12px 34px color-mix(in srgb, var(--gold) 60%, transparent); }
  .tbtn.big.on .disc { background: var(--accent); box-shadow: 0 12px 34px color-mix(in srgb, var(--accent) 60%, transparent); }
  .tbtn .disc svg { width: 86px; height: 86px; fill: var(--bone); }
  .tbtn.on .disc svg { fill: var(--ink); }
  .tbtn .cap { font-size: 22px; letter-spacing: 4px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
  .tbtn.on .cap { color: var(--gold); }
  .tbtn.big.on .cap { color: var(--accent); }

  .keys {
    position: fixed; bottom: 14px; left: 0; right: 0; text-align: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; letter-spacing: 1px; color: #4a4a4a;
  }
  @media (max-width: 700px) { .keys { display: none; } }
</style>

<div id="viewport">
  <div id="stage">
    <div class="bloom"></div>
    <div class="rings"></div>
    <div class="hairline"></div>
    <div class="vignette"></div>

    <div class="centre">
      <div class="facecol">
        <div class="badge">
          <span class="k">Round</span>
          <span class="n" id="round-no">1</span>
        </div>
        <div class="face" id="face">05:00</div>
        <div class="track"><i id="track"></i><u id="mark" hidden></u></div>
      </div>
    </div>

    <div class="frame">
      <header>
        <div class="lockup">
          <img class="mark kanji" src="__KANJI__" alt="迷宮">
          <img class="mark word" src="__WORD__" alt="Labyrinth Brazilian Jiu-Jitsu">
        </div>
        <div class="wallclock">
          <div class="time" id="wall-time">7:26 PM</div>
          <div class="label date" id="wall-date" style="font-size:20px;letter-spacing:3px">Thursday, 30 Jul</div>
        </div>
      </header>

      <footer>
        <div class="transport" id="transport"></div>
        <div class="cards" id="cards"></div>
      </footer>
    </div>
  </div>
</div>

<div class="keys">arrow keys move &amp; adjust · enter selects · space starts and pauses</div>

<script>
(function () {
  "use strict";

  /* ---------- the same engine the app runs, in miniature ---------- */
  var S = {
    round: 300, warning: 10, rest: 60,
    phase: "ready", no: 1, remaining: 300, running: false,
    deadline: null, lastCued: Infinity
  };

  var RANGE = {
    /* Fine steps at the short end, coarse once the rounds get long. */
    round:   { min: 30, max: 1800, step: function (v, d) { return (d > 0 ? v >= 300 : v > 300) ? 60 : 15; } },
    warning: { min: 0,  max: 180,  step: 5  },
    rest:    { min: 0,  max: 600,  step: 15 }
  };

  var CARDS = ["round", "warning", "rest"];
  var BUTTONS = ["playPause", "reset"];
  /* Everything focusable, in the order it appears along the bottom. */
  var STRIP = BUTTONS.concat(CARDS);
  var TINT = { round: "var(--green)", warning: "var(--yellow)", rest: "var(--red)" };
  var focus = "playPause";

  /* ---------- sound, synthesised the way the app does it ----------
     The bell is a stack of inharmonic partials with a noise strike on the
     front; the clapper is noise pushed through a resonant band, three times.
     Same recipe as Cues.swift, spoken in Web Audio. */
  var ctx = null;
  function audio() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  /* One sine partial: start loud, fall away over `decay` seconds. */
  function partial(dest, freq, gain, decay, at) {
    var c = audio(); if (!c) return;
    var osc = c.createOscillator(), amp = c.createGain();
    osc.type = "sine"; osc.frequency.value = freq;
    amp.gain.setValueAtTime(0, at);
    amp.gain.linearRampToValueAtTime(gain, at + 0.003);
    amp.gain.setTargetAtTime(0, at + 0.003, decay);
    osc.connect(amp); amp.connect(dest);
    osc.start(at); osc.stop(at + decay * 5 + 0.05);
  }

  /* Seeded, so the clap sounds identical every time — a cue that shifts
     between presses is unsettling. */
  var noiseBuffer = null;
  function noise() {
    var c = audio();
    if (!noiseBuffer) {
      noiseBuffer = c.createBuffer(1, Math.floor(c.sampleRate), c.sampleRate);
      var d = noiseBuffer.getChannelData(0), x = 12345;
      for (var i = 0; i < d.length; i++) { x = (x * 1103515245 + 12345) >>> 0; d[i] = x / 2147483648 - 1; }
    }
    return noiseBuffer;
  }

  function crack(dest, at, dur, decay, gain, centre, q, bodyCentre, bodyQ, bodyGain) {
    var c = audio(); if (!c) return;
    var src = c.createBufferSource(); src.buffer = noise(); src.loop = true;
    var env = c.createGain();
    env.gain.setValueAtTime(gain, at);
    env.gain.setTargetAtTime(0, at, decay);
    var band = c.createBiquadFilter();
    band.type = "bandpass"; band.frequency.value = centre; band.Q.value = q;
    src.connect(band); band.connect(env); env.connect(dest);
    if (bodyGain > 0) {
      var body = c.createBiquadFilter();
      body.type = "bandpass"; body.frequency.value = bodyCentre; body.Q.value = bodyQ;
      var trim = c.createGain(); trim.gain.value = bodyGain;
      src.connect(body); body.connect(trim); trim.connect(env);
    }
    src.start(at); src.stop(at + dur + 0.05);
  }

  function bus(level) {
    var c = audio(); if (!c) return null;
    var g = c.createGain(); g.gain.value = level; g.connect(c.destination);
    return g;
  }

  var CUE = {
    /* The boxing bell — a round starts and a round ends on the same sound. */
    bell: function () {
      var c = audio(); if (!c) return;
      /* A fifth lower than a hand bell and a good deal shorter: a ring bell
         is struck brass with somebody's hand near it, not a church tower. */
      var out = bus(0.34), t = c.currentTime, f0 = 392;
      var shape = [[1.00, 1.00, 1.05], [1.19, 0.50, 0.85], [1.51, 0.38, 0.70], [2.00, 0.72, 0.62],
                   [2.51, 0.28, 0.46], [2.99, 0.26, 0.36], [4.13, 0.16, 0.26], [5.42, 0.11, 0.19],
                   [6.79, 0.07, 0.14]];
      shape.forEach(function (p, i) {
        partial(out, f0 * p[0], p[1], p[2], t);
        /* A few cents apart on the low partials gives the tail its warble. */
        if (i < 4) partial(out, f0 * p[0] * 1.004, p[1] * 0.6, p[2] * 0.85, t);
      });
      crack(out, t, 0.05, 0.009, 0.55, 2600, 0.8, 900, 1.4, 0.45);
    },

    /* The ten-second clapper: two pieces of hardwood struck together, three
       times. A hard broadband crack, a short ring from the block itself around
       2.4 kHz, and a click on top. Almost no tail — wood stops dead. */
    clap: function () {
      var c = audio(); if (!c) return;
      var out = bus(0.55), t = c.currentTime;
      for (var i = 0; i < 3; i++) {
        var at = t + i * 0.20;
        crack(out, at, 0.12, 0.0045, 1.0, 1150, 0.7, 520, 2.0, 0.55);
        crack(out, at, 0.12, 0.0095, 0.7, 2400, 2.6, 0, 1, 0);
        crack(out, at, 0.12, 0.0028, 0.6, 4800, 1.2, 0, 1, 0);
      }
    },

    /* Scrolling a value. */
    tick: function () {
      var c = audio(); if (!c) return;
      var out = bus(0.5), t = c.currentTime;
      partial(out, 2100, 0.13, 0.012, t);
      partial(out, 3150, 0.06, 0.008, t);
    },

    /* Focus landing on a control — lower and softer than the scroll tick. */
    select: function () {
      var c = audio(); if (!c) return;
      var out = bus(0.5), t = c.currentTime;
      partial(out, 880, 0.14, 0.03, t);
      partial(out, 1320, 0.05, 0.02, t);
    }
  };
  function cue(name) { if (CUE[name]) CUE[name](); }

  /* ---------- formatting ---------- */
  function mmss(s) {
    s = Math.max(0, s);
    return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }
  function compact(s) { return s === 0 ? "OFF" : Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

  function phaseLength() { return S.phase === "rest" ? S.rest : S.round; }
  function displaySeconds() { return Math.max(0, Math.ceil(S.remaining - 0.0001)); }
  function isWarning() { return S.phase === "work" && S.warning > 0 && S.remaining <= S.warning + 0.001; }

  /* ---------- transport ---------- */
  function begin(phase, seconds, sound) {
    S.phase = phase;
    S.remaining = seconds;
    S.deadline = performance.now() + seconds * 1000;
    S.running = true;
    S.lastCued = Infinity;
    if (sound) cue(sound);
  }
  function start() {
    if (S.phase === "ready") { begin("work", S.round, "bell"); return; }
    S.deadline = performance.now() + S.remaining * 1000;
    S.running = true; S.lastCued = Infinity;
  }
  function pause() {
    if (!S.running) return;
    S.remaining = Math.max(0, (S.deadline - performance.now()) / 1000);
    S.running = false; S.deadline = null;
  }
  function toggle() { S.running ? pause() : start(); }
  /* Zeroes everything: top of round 1, stopped, full round on the face. */
  function clear() {
    S.running = false; S.deadline = null; S.phase = "ready"; S.no = 1;
    S.remaining = S.round; S.lastCued = Infinity;
  }
  function reset() { clear(); cue("select"); }
  /* The clock hit zero — the bell rings either way, and the only question is
     whether there is a rest in between. */
  function advance() {
    S.lastCued = Infinity;
    if (S.phase === "work") {
      if (S.rest > 0) { begin("rest", S.rest, "bell"); }
      else { S.no += 1; begin("work", S.round, "bell"); }
    } else if (S.phase === "rest") {
      S.no += 1; begin("work", S.round, "bell");
    } else { pause(); }
  }

  /* ---------- chrome ---------- */
  function accent() {
    if (S.phase === "rest") return "var(--red)";
    if (S.phase === "work" && isWarning()) return "var(--gold-light)";
    return "var(--gold)";
  }
  function faceColour() {
    if (S.phase === "rest") return "var(--red)";
    if (S.phase === "work") return isWarning() ? "var(--gold-light)" : "var(--bone)";
    return "var(--gold)";
  }
  /* Where along the bar the warning will fire, 0..1 from the left, so it can be
     seen coming. Null during a rest, or with the warning switched off. */
  function warningMarker() {
    if (S.phase === "rest" || S.warning <= 0 || S.warning >= S.round) return null;
    return S.warning / S.round;
  }

  /* ---------- strip markup ---------- */
  var LABELS = { round: "Round", warning: "Warning", rest: "Rest" };
  var cards = document.getElementById("cards");
  CARDS.forEach(function (key) {
    var el = document.createElement("div");
    el.className = "card"; el.dataset.field = key;
    el.style.setProperty("--tint", TINT[key]);
    el.title = LABELS[key];
    el.innerHTML = '<div class="step up">▲</div><div class="v"></div><div class="step down">▼</div>';
    el.addEventListener("click", function () { focus = key; render(); });
    el.querySelector(".up").addEventListener("click", function (e) { e.stopPropagation(); focus = key; adjust(key, 1); });
    el.querySelector(".down").addEventListener("click", function (e) { e.stopPropagation(); focus = key; adjust(key, -1); });
    cards.appendChild(el);
  });

  var ICON = {
    play: '<path d="M8 5v14l11-7z" transform="scale(2)"/>',
    pause: '<path d="M6 5h4v14H6zm8 0h4v14h-4z" transform="scale(2)"/>',
    reset: '<path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" transform="scale(2)"/>'
  };
  var CAPS = { playPause: "Start", reset: "Reset" };
  var ACTIONS = { playPause: toggle, reset: reset };
  var transport = document.getElementById("transport");
  BUTTONS.forEach(function (key) {
    var el = document.createElement("div");
    el.className = "tbtn" + (key === "playPause" ? " big" : "");
    el.dataset.field = key;
    el.innerHTML = '<div class="disc"><svg viewBox="0 0 48 48"></svg></div><div class="cap"></div>';
    el.addEventListener("click", function () { focus = key; ACTIONS[key](); render(); });
    transport.appendChild(el);
  });

  /* ---------- input ---------- */
  function adjust(key, dir) {
    var r = RANGE[key];
    var step = typeof r.step === "function" ? r.step(S[key], dir) : r.step;
    S[key] = Math.min(r.max, Math.max(r.min, S[key] + dir * step));
    if (key === "round" && !S.running && S.phase === "ready") S.remaining = S.round;
    cue("tick");
    render();
  }
  /* Up and down are spent changing values, so left and right do the travelling. */
  function move(dir) {
    var i = STRIP.indexOf(focus), next = focus;
    if (dir === "left") next = STRIP[Math.max(0, i - 1)];
    else if (dir === "right") next = STRIP[Math.min(STRIP.length - 1, i + 1)];
    else if (CARDS.indexOf(focus) >= 0) { adjust(focus, dir === "up" ? 1 : -1); return; }
    /* Pushing against the end of the strip should be silent. */
    if (next !== focus) { focus = next; cue("select"); }
    render();
  }
  var KEYS = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down" };
  document.addEventListener("keydown", function (e) {
    if (KEYS[e.key]) { e.preventDefault(); move(KEYS[e.key]); return; }
    if (e.key === " " || e.key === "MediaPlayPause") { e.preventDefault(); toggle(); render(); return; }
    if (e.key === "Enter") {
      e.preventDefault();
      if (ACTIONS[focus]) ACTIONS[focus]();
      render();
    }
  });

  /* ---------- render ---------- */
  var faceEl = document.getElementById("face");
  var trackEl = document.getElementById("track");
  var markEl = document.getElementById("mark");
  var roundNo = document.getElementById("round-no");
  var stage = document.getElementById("stage");
  var lastSecond = null;

  /* The app shrinks an over-wide value with minimumScaleFactor; do the same
     here so a 30:00 round still fits its container. */
  var VALUE_SIZE = 104;
  function fitValue(el, text) {
    if (el.textContent === text && el.style.fontSize) return;
    el.textContent = text;
    el.style.fontSize = VALUE_SIZE + "px";
    var room = el.parentNode.clientWidth - 40;
    if (el.scrollWidth > room) {
      el.style.fontSize = Math.max(VALUE_SIZE * 0.5, VALUE_SIZE * room / el.scrollWidth) + "px";
    }
  }

  function render() {
    var seconds = displaySeconds();
    stage.style.setProperty("--accent", accent());
    stage.style.setProperty("--face", faceColour());
    stage.style.setProperty("--bloom", S.running ? 1 : 0.55);

    faceEl.textContent = mmss(seconds);
    var pulsing = (isWarning() || S.phase === "rest") && S.running && seconds % 2 === 0;
    faceEl.classList.toggle("pulse", pulsing);

    var total = Math.max(1, phaseLength());
    trackEl.style.width = (Math.max(0, Math.min(1, S.remaining / total)) * 100) + "%";

    stage.classList.toggle("stage-paused", !S.running);
    stage.classList.toggle("stage-warning", isWarning() && S.running);

    var mark = warningMarker();
    markEl.hidden = mark === null || mark <= 0.02 || mark >= 0.97;
    if (!markEl.hidden) markEl.style.left = "calc(" + (mark * 100) + "% - 1.5px)";

    roundNo.textContent = S.no;

    CARDS.forEach(function (key) {
      var el = cards.querySelector('[data-field="' + key + '"]');
      var r = RANGE[key];
      el.classList.toggle("on", focus === key);
      fitValue(el.querySelector(".v"), compact(S[key]));
      el.querySelector(".up").classList.toggle("off", S[key] >= r.max);
      el.querySelector(".down").classList.toggle("off", S[key] <= r.min);
    });

    BUTTONS.forEach(function (key) {
      var el = transport.querySelector('[data-field="' + key + '"]');
      el.classList.toggle("on", focus === key);
      var glyph = key === "playPause" ? (S.running ? ICON.pause : ICON.play) : ICON[key];
      el.querySelector("svg").innerHTML = glyph;
      el.querySelector(".cap").textContent = key === "playPause" ? (S.running ? "Pause" : "Start") : CAPS[key];
    });
  }

  function frame() {
    if (S.running && S.deadline !== null) {
      var left = (S.deadline - performance.now()) / 1000;
      S.remaining = Math.max(0, left);
      if (left <= 0) {
        advance();
      } else {
        var second = Math.ceil(left);
        if (second !== S.lastCued) {
          var previous = S.lastCued;
          S.lastCued = second;
          if (S.phase === "work" && S.warning > 0 && second === S.warning && previous > second) cue("clap");
        }
      }
    }
    var seconds = displaySeconds();
    if (seconds !== lastSecond || S.running) { lastSecond = seconds; render(); }
    requestAnimationFrame(frame);
  }

  /* ---------- wall clock + scaling ---------- */
  function wall() {
    var now = new Date();
    document.getElementById("wall-time").textContent =
      now.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    document.getElementById("wall-date").textContent =
      now.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "short" });
  }
  setInterval(wall, 10000); wall();

  function fit() {
    var k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = "scale(" + k + ")";
  }
  window.addEventListener("resize", fit); fit();

  render();
  requestAnimationFrame(frame);
})();
</script>
